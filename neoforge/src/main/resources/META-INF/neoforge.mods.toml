modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile = "icon.png" #optional (needs to be in the root of your mod jar)
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type = "required"
versionRange = "${neoforge_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "balm"
type = "required"
versionRange = "${balm_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "hbs_foundation"
type = "required"
versionRange = "[${foundation_version_min},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[${create_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[${sable_version_range},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "simulated"
type = "optional"
versionRange = "[${simulated_version_range},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "aeronautics"
type = "optional"
versionRange = "[${simulated_version_range},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "offroad"
type = "optional"
versionRange = "[${simulated_version_range},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[${curios_version_range},)"
ordering = "NONE"
side = "BOTH"
